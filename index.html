<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بایگانی جزوه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #0B2545;
    --paper-card: #123262;
    --ink: #FFFFFF;
    --ink-soft: #B7CCEA;
    --line: rgba(255,255,255,0.18);
    --indigo: #FFFFFF;
    --gold: #7EB0EE;
    --gold-soft: rgba(126,176,238,0.22);
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,0.08) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: 'Vazirmatn', sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }
  .bg-decor{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .bg-decor .item{
    position: absolute;
    color: var(--gold);
    opacity: .16;
  }
  .bg-decor .item.dim{ opacity: .10; }
  .bg-decor .formula{
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 500;
    color: var(--gold);
    opacity: .18;
    direction: ltr;
    letter-spacing: .02em;
  }
  .orbit-ring{ transform-origin: center; animation: spin 60s linear infinite; }
  .orbit-ring.rev{ animation-direction: reverse; animation-duration: 90s; }
  @keyframes spin{ from{ transform: rotate(0deg);} to{ transform: rotate(360deg);} }
  @media (prefers-reduced-motion: reduce){
    .orbit-ring{ animation: none; }
  }
  header, .divider, .search-wrap, .controls, .grid, .empty, footer{
    position: relative;
    z-index: 1;
  }
  .mono{ font-family: 'JetBrains Mono', monospace; direction: ltr; unicode-bidi: isolate; }
  header{
    max-width: 980px;
    margin: 0 auto;
    padding: 64px 24px 32px;
    text-align: center;
  }
  .kicker{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: .12em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 14px;
    direction: ltr;
  }
  h1{
    font-size: clamp(32px, 5vw, 48px);
    font-weight: 800;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  header p.sub{
    color: var(--ink-soft);
    font-size: 16px;
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.9;
  }
  .divider{
    width: 100%;
    max-width: 980px;
    margin: 8px auto 0;
    padding: 0 24px;
  }
  .divider svg{ width:100%; height:14px; display:block; }
  .controls{
    max-width: 980px;
    margin: 36px auto 8px;
    padding: 0 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: center;
  }
  .tag-btn{
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--paper-card);
    color: var(--ink-soft);
    cursor: pointer;
    transition: all .18s ease;
  }
  .tag-btn:hover{ border-color: var(--gold); color: var(--ink); }
  .tag-btn.active{
    background: var(--gold);
    border-color: var(--gold);
    color: #0B2545;
  }
  .search-wrap{
    max-width: 520px;
    margin: 18px auto 0;
    padding: 0 24px;
  }
  .search-wrap input{
    width: 100%;
    padding: 12px 18px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--paper-card);
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .search-wrap input:focus{
    border-color: var(--indigo);
    box-shadow: 0 0 0 3px rgba(44,58,94,0.12);
  }
  .search-wrap input::placeholder{ color: #9B968A; }
  .grid{
    max-width: 980px;
    margin: 40px auto 100px;
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }
  .card{
    position: relative;
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 22px 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    transition: transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s ease, border-color .22s ease;
    box-shadow: 0 1px 0 rgba(33,31,27,0.04);
  }
  .card::before{
    content:"";
    position:absolute;
    top: 14px; bottom: 14px;
    right: 8px;
    width: 1px;
    background: repeating-linear-gradient(to bottom, var(--line) 0 4px, transparent 4px 9px);
  }
  .card:hover{
    transform: translateY(-3px);
    border-color: var(--gold);
    box-shadow: 0 12px 24px -12px rgba(33,31,27,0.28);
  }
  .card-top{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    padding-right: 14px;
  }
  .tag-pill{
    font-size: 11px;
    font-weight: 700;
    color: var(--gold);
    background: var(--gold-soft);
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }
  .stamp{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 9px;
    direction: ltr;
  }
  .card h3{
    margin: 0;
    padding-right: 14px;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.6;
  }
  .card p{
    margin: 0;
    padding-right: 14px;
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.8;
    flex-grow: 1;
  }
  .card-foot{
    padding-right: 14px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-top: 4px;
  }
  .open{
    font-size: 13px;
    font-weight: 700;
    color: var(--indigo);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .open svg{ width:14px; height:14px; transition: transform .18s ease; }
  .card:hover .open svg{ transform: translateX(-3px); }
  .size{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    opacity: .7;
    direction: ltr;
  }
  .empty{
    max-width: 980px;
    margin: 40px auto 100px;
    padding: 40px 24px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    display: none;
  }
  footer{
    text-align:center;
    padding: 30px 24px 50px;
    color: #9B968A;
    font-size: 12.5px;
    font-family: 'JetBrains Mono', monospace;
    direction: ltr;
    letter-spacing: .03em;
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
  a:focus-visible, button:focus-visible, input:focus-visible{
    outline: 2px solid var(--indigo);
    outline-offset: 2px;
  }
</style>
</head>
